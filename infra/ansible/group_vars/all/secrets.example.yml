# Template for secrets.age.yml. Copy, fill in, then encrypt:
#   age -r <operators' public keys> -o group_vars/all/secrets.age.yml secrets.yml && shred -u secrets.yml
# Never commit the plaintext file.
secrets:
  postgres:
    malgary_owner: ""
    malgary_app: ""
    zitadel: ""
  zitadel:
    masterkey: ""            # exactly 32 characters
    first_admin_username: ""
    first_admin_email: ""
    first_admin_password: ""
    api_project_id: ""       # Zitadel project ID of the backend API (token audience)
    claims_signing_key: ""   # signing key of the Actions v2 target for the groups claim
  email:
    smtp_user: ""
    smtp_password: ""
  grafana:
    prom_url: ""
    prom_user: ""
    loki_url: ""
    loki_user: ""
    api_key: ""
  spaces:
    access_key: ""
    secret_key: ""
  backup:
    age_recipient: ""        # public key; the private key stays offline with the owners
  deployer:
    ssh_private_key: ""   # ed25519, used by the control host to reach gateways
    ssh_public_key: ""
  digitalocean:
    reserved_ip_token: ""    # token used by keepalived to move reserved IPs
