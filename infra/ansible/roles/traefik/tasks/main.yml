---
# Traefik runs on the host network so it can reach services published on 127.0.0.1:<port>
# (tenant stacks, Zitadel, backend). Each tenant stack drops one file into dynamic/.
- name: Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop: ["{{ traefik_dir }}", "{{ traefik_dir }}/dynamic", "{{ traefik_dir }}/acme"]

- name: Static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_dir }}/traefik.yml"
    mode: "0640"
  notify: Restart traefik

- name: Compose file and setup-page server config
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0640"
  loop:
    - {src: compose.yaml.j2, dest: "{{ traefik_dir }}/compose.yaml"}
    - {src: setup-pages.conf.j2, dest: "{{ traefik_dir }}/setup-pages.conf"}
    - {src: setup-pages.yml.j2, dest: "{{ traefik_dir }}/dynamic/setup-pages.yml"}

- name: Setup pages root
  ansible.builtin.file: {path: /opt/malgary/setup-pages, state: directory, mode: "0755"}

- name: Start Traefik
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    state: present
